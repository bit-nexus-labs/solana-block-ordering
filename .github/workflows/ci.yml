name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analysis/requirements.txt
      - run: cd analysis && python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Census on devnet (read only)
        run: docker compose run --rm probe census
      - name: Dry-run session on devnet with a throwaway key
        run: |
          mkdir -p keys data
          docker compose run --rm probe keygen
          docker compose run --rm probe run --min-stake-sol 0 --max-windows 3 --slot-ms 400
      - name: Analysis reproduces results from committed data
        run: |
          if ls data/*-live >/dev/null 2>&1; then docker compose run --rm analyze; else echo "no live data yet"; fi
